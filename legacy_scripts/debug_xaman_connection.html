<!DOCTYPE html>
<html>
<head>
    <title>Xaman Connection Debug</title>
    <script type="importmap">
    {
      "imports": {
        "xumm": "./node_modules/xumm/dist/index.js"
      }
    }
    </script>
</head>
<body>
    <h1>Xaman Connection Debug</h1>
    <button id="connectBtn">Connect to Xaman</button>
    <div id="status"></div>
    <div id="account"></div>
    
    <script type="module">
        import { Xumm } from 'xumm';
        
        const apiKey = "b53edeaf-0046-49a6-a100-4bb284be3682";
        const xumm = new Xumm(apiKey);
        
        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');
        const accountDiv = document.getElementById('account');
        
        connectBtn.addEventListener('click', async () => {
            try {
                statusDiv.textContent = 'Connecting...';
                const result = await xumm.authorize();
                statusDiv.textContent = 'Authorization successful!';
                
                const account = await xumm.user.account;
                if (account) {
                    accountDiv.textContent = `Connected account: ${account}`;
                } else {
                    accountDiv.textContent = 'No account found';
                }
            } catch (error) {
                statusDiv.textContent = `Error: ${error.message}`;
                console.error(error);
            }
        });
        
        xumm.on("ready", () => {
            statusDiv.textContent = 'Xumm SDK ready';
        });
        
        xumm.on("error", (error) => {
            statusDiv.textContent = `Xumm SDK error: ${error.message}`;
            console.error(error);
        });
    </script>
</body>
</html>
