<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xumm Test</title>
</head>
<body>
    <h1>Xumm SDK Test</h1>
    <button id="connectBtn">Connect with Xaman</button>
    <div id="result"></div>

    <script src="https://xaman.app/assets/cdn/xumm.min.js"></script>
    <script>
        const apiKey = 'b53edeaf-0046-49a6-a100-4bb284be3682'; // Your API key
        const resultDiv = document.getElementById('result');
        
        resultDiv.innerHTML += '<p>Creating Xumm instance...</p>';
        console.log('Creating Xumm instance...');
        
        try {
            const xumm = new Xumm(apiKey);
            resultDiv.innerHTML += '<p>Xumm instance created successfully</p>';
            console.log('Xumm instance created successfully');
            
            xumm.on("ready", () => {
                resultDiv.innerHTML += '<p>Xumm SDK is ready!</p>';
                console.log('Xumm SDK is ready!');
            });
            
            xumm.on("error", (error) => {
                resultDiv.innerHTML += `<p>Xumm SDK error: ${error.message || error}</p>`;
                console.error('Xumm SDK error:', error);
            });
            
            xumm.on("retrieving", () => {
                resultDiv.innerHTML += '<p>Xumm SDK retrieving...</p>';
                console.log('Xumm SDK retrieving...');
            });
            
            document.getElementById('connectBtn').onclick = async () => {
                try {
                    resultDiv.innerHTML += '<p>Authorizing...</p>';
                    console.log('Authorizing...');
                    const authResult = await xumm.authorize();
                    resultDiv.innerHTML += `<p>Authorization result: ${JSON.stringify(authResult)}</p>`;
                    console.log('Authorization result:', authResult);
                } catch (error) {
                    resultDiv.innerHTML += `<p>Authorization error: ${error.message || error}</p>`;
                    console.error('Authorization error:', error);
                }
            };
        } catch (error) {
            resultDiv.innerHTML += `<p>Error creating Xumm instance: ${error.message || error}</p>`;
            console.error('Error creating Xumm instance:', error);
        }
    </script>
</body>
</html>
