<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Xumm Test</title>
</head>
<body>
    <h1>Minimal Xumm Test</h1>
    <button id="testBtn">Test Xumm</button>
    <div id="output"></div>

    <script>
        document.getElementById('testBtn').onclick = async () => {
            try {
                document.getElementById('output').innerHTML = '<p>Testing Xumm...</p>';
                
                // Try to import the module
                const module = await import('https://xaman.app/assets/cdn/xumm.min.js');
                console.log('Module loaded:', module);
                
                // Try to create an instance
                if (window.Xumm) {
                    const xumm = new window.Xumm('b53edeaf-0046-49a6-a100-4bb284be3682');
                    console.log('Xumm instance created:', xumm);
                    document.getElementById('output').innerHTML += '<p>Xumm instance created successfully</p>';
                } else {
                    document.getElementById('output').innerHTML += '<p>Xumm class not found in window</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('output').innerHTML += `<p>Error: ${error.message}</p>`;
            }
        };
    </script>
</body>
</html>
