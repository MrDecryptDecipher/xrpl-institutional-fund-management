<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xaman Debug Test</title>
</head>
<body>
    <h1>Xaman SDK Debug Test</h1>
    <button id="initBtn">Initialize Xaman</button>
    <button id="connectBtn" disabled>Connect Wallet</button>
    <div id="output"></div>

    <script type="module">
        const output = document.getElementById('output');
        let xumm = null;

        function log(message) {
            console.log(message);
            output.innerHTML += `<p>${new Date().toISOString()}: ${message}</p>`;
        }

        document.getElementById('initBtn').onclick = async () => {
            try {
                log("Starting Xaman initialization...");
                
                // Get API key from environment variables
                const apiKey = 'b53edeaf-0046-49a6-a100-4bb284be3682';
                log(`API key: ${apiKey ? `${apiKey.substring(0, 8)}...` : "NOT FOUND"}`);
                
                if (!apiKey) {
                    throw new Error("API key not found");
                }
                
                // Dynamically import Xumm
                log("Importing Xumm module...");
                const xummModule = await import("https://xaman.app/assets/cdn/xumm.min.js");
                log("Xumm module imported");
                
                // For CDN version, Xumm is available globally
                if (typeof Xumm !== 'undefined') {
                    log("Creating Xumm instance with global Xumm class...");
                    xumm = new Xumm(apiKey);
                } else {
                    log("Xumm not found in global scope");
                }
                
                if (xumm) {
                    log("Xumm instance created successfully");
                    
                    // Set up event listeners
                    xumm.on("error", (error) => {
                        log(`Xumm error: ${JSON.stringify(error)}`);
                    });
                    
                    xumm.on("retrieving", () => {
                        log("Xumm retrieving...");
                    });
                    
                    xumm.on("ready", () => {
                        log("Xumm ready!");
                        document.getElementById('connectBtn').disabled = false;
                    });
                    
                    xumm.on("success", async () => {
                        log("Xumm authorization successful");
                        try {
                            const account = await xumm.user.account;
                            log(`User account: ${account}`);
                        } catch (error) {
                            log(`Error getting account: ${error.message}`);
                        }
                    });
                    
                    xumm.on("logout", () => {
                        log("User logged out");
                        document.getElementById('connectBtn').disabled = true;
                    });
                } else {
                    log("Failed to create Xumm instance");
                }
            } catch (error) {
                log(`Initialization error: ${error.message}`);
                console.error(error);
            }
        };

        document.getElementById('connectBtn').onclick = async () => {
            if (xumm) {
                try {
                    log("Authorizing...");
                    await xumm.authorize();
                    log("Authorization initiated");
                } catch (error) {
                    log(`Authorization error: ${error.message}`);
                }
            }
        };
    </script>
</body>
</html>
