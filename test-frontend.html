<!DOCTYPE html>
<html>
<head>
    <title>Test Frontend Access</title>
</head>
<body>
    <h1>Testing Frontend Access</h1>
    <p>If you can see this, the frontend server is working.</p>
    <button id="testButton">Test API Connection</button>
    <div id="result"></div>

    <script>
        document.getElementById('testButton').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                document.getElementById('result').innerHTML = `<p>API Response: ${JSON.stringify(data)}</p>`;
            } catch (error) {
                document.getElementById('result').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
